<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyTalk // Server Panel</title>
<link rel="stylesheet" href="/static/panel.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🖥</text></svg>">
</head>
<body>

<div class="topbar">
  <span class="brand">■ TINYTALK</span>
  <span class="sep">/</span>
  <span>bảng điều khiển server</span>
  <span class="spacer"></span>
  <span id="conn">○ đang kết nối…</span>
</div>

<div class="masthead">
  <h1>SERVER<em>_</em>PANEL</h1>
  <span class="tag">Chạy trên 127.0.0.1:9199 · quyền như user hiện tại · đừng mở ra mạng</span>
  <div class="actions">
    <button id="btn-reload">↻  Nạp lại config</button>
    <button id="btn-closeall">✕  Đóng hết log</button>
  </div>
</div>

<div class="statusstrip" id="strip"></div>


<div id="kpi-row" class="kpirow"></div>

<main class="shell">
  <div class="col-left">
    <div id="groups"></div>

    <div id="charts-body"></div>

  </div>

  <aside class="col-right">
    <div class="logstack" id="logstack">
      <div class="logempty" id="logempty">
        <div style="font-size:2rem;opacity:.5">▤</div>
        <div>Bấm <b style="color:var(--cyan)">▤ Log</b> trên một card để xem log ở đây.</div>
        <div style="font-size:12px">Mở được nhiều log cùng lúc.
          Khung này bám theo màn hình khi bạn cuộn trang.</div>
      </div>
    </div>
  </aside>
</main>


<div id="toasts"></div>

<!-- glow filter dùng chung cho mọi chart -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
<script src="/static/charts_tab.js"></script>
</body>
</html>
